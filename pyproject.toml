[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copyright-deposit-builder"
version = "1.0.0"
description = "Builds US Copyright Office compliant source-code deposit PDFs from a source tree."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "pygments>=2.15",
    "charset-normalizer>=3.2",
    "pathspec>=0.11",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pypdf>=4.0", "pytest>=7.4"]

[project.scripts]
copyright-deposit = "copyright_deposit.cli:main"

[tool.setuptools.packages.find]
include = ["copyright_deposit*"]

[tool.setuptools.package-data]
"copyright_deposit.assets" = ["fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
