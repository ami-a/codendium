[build-system]
# The SPDX string form of `license` below needs setuptools >= 77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codendium"
dynamic = ["version"]
description = "Codendium - builds US Copyright Office compliant source-code deposit PDFs from a source tree."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ami-a" }]
keywords = [
    "copyright",
    "registration",
    "deposit",
    "source-code",
    "pdf",
    "compendium",
    "intellectual-property",
    "legal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
]
# Floors are set to the first release providing the API this code actually
# calls - not to whatever happened to be current when it was written. Where a
# floor is higher than the API requires, the reason is Python-version support,
# and it is noted. Please do not raise these without a concrete reason.
dependencies = [
    # API used is pre-4.0 throughout; 4.0 is the first release supporting only
    # Python 3.7+, which is the floor that matters for us.
    "reportlab>=4.0",
    # Only Comment/String/Token + get_lexer_by_name(stripnl=, ensurenl=).
    "pygments>=2.7",
    # from_bytes(...).best() is the 2.0 API; 1.x had a different entry point.
    "charset-normalizer>=2.0",
    # PathSpec.from_lines("gitwildmatch", ...) + match_file(); 0.5+ in truth.
    "pathspec>=0.9",
]

[project.optional-dependencies]
# The Qt API used here is 6.2-era, so this floor is not about the API: both
# 6.6.0 and 6.8.0 declare `requires_python <3.13` and so exclude the 3.13 we
# claim in the classifiers above. 6.8.1 is the first release that allows it.
gui = ["PySide6>=6.8.1"]
# Tests assert on pypdf's extracted text, not just page counts, so the
# extraction behaviour is a real dependency: 4.0 is what they were written to.
test = ["pytest>=7.4", "pypdf>=4.0"]
lint = ["ruff>=0.5"]
build = ["build>=1.2", "twine>=6.1", "trove-classifiers>=2024.1.1"]
dev = ["codendium[gui,test,lint,build]"]

[project.urls]
Homepage = "https://github.com/ami-a/codendium"
Repository = "https://github.com/ami-a/codendium"
Issues = "https://github.com/ami-a/codendium/issues"

[project.scripts]
copyright-deposit = "copyright_deposit.cli:main"
codendium = "copyright_deposit.__main__:main"

[project.gui-scripts]
codendium-gui = "copyright_deposit.gui.app:run"

[tool.setuptools]
# Listed explicitly rather than auto-discovered. All seven are required: a
# shorter list still builds a wheel, but one that imports and then fails.
packages = [
    "copyright_deposit",
    "copyright_deposit.assets",
    # No .py files: listed only so setuptools does not warn about an
    # "importable package absent from `packages`". Its contents ship as
    # package-data of copyright_deposit.assets below.
    "copyright_deposit.assets.fonts",
    "copyright_deposit.core",
    "copyright_deposit.core.scanning",
    "copyright_deposit.core.strip",
    "copyright_deposit.gui",
    "copyright_deposit.gui.panels",
]

[tool.setuptools.dynamic]
# Parsed statically from the literal; the package is never imported at build
# time, which is why __init__.py must stay free of module-level imports.
version = { attr = "copyright_deposit.__version__" }

[tool.setuptools.package-data]
# Globs are relative to copyright_deposit/assets/.
# `fonts/*.md` is load-bearing, not documentation: core.metrics gates bundled
# fonts on `_ASSET_DIR.is_dir()`, and a wheel does not record empty
# directories. README.md is the only thing that makes fonts/ exist on disk
# after install, so dropping this glob would silently remove the directory
# the README tells users to drop a .ttf into.
"copyright_deposit.assets" = ["*.svg", "fonts/*.ttf", "fonts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/helpers.py is imported as a top-level module. Under the default
# `prepend` import mode that works only because tests/ has no __init__.py;
# declaring it here makes it intentional rather than emergent.
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# Above the longest existing line (122). This codebase is hand-formatted with
# aligned inline comments; `ruff format` is deliberately not enforced.
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "W"]
