name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[lint]"
      # `ruff format` is deliberately not enforced: this code is hand-aligned
      # (see the inline comments in core/render.py) and reformatting it is a
      # separate decision from packaging.
      - run: ruff check --output-format=github .

  test:
    name: Test ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One leg each on the other two platforms, on the version the
          # project is actually developed against.
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # No PySide6: nothing in the suite imports Qt, so every leg stays fast.
      - run: pip install -e ".[test]"
      # Run from the repo root: tests/helpers.py is imported as a top-level
      # module (see `pythonpath` in pyproject.toml).
      - run: python -m pytest -q

  gui-smoke:
    name: GUI import (headless)
    needs: lint
    # Pinned deliberately, NOT ubuntu-latest: the apt package names below are
    # specific to 24.04 (the t64 ABI transition renamed several of them), so
    # this job must not silently ride a runner-image upgrade.
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the shared libraries Qt 6 dlopens
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0t64 libdbus-1-3 \
            libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libx11-6 libx11-xcb1 libxext6 libxrender1 \
            libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xkb1
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[gui]"
      - name: Import the GUI and render the packaged logo
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          import copyright_deposit.gui.app  # noqa: F401  (import must not raise)
          from copyright_deposit.gui import branding

          app = QApplication([])
          # branding.app_icon() swallows exceptions and can return an empty
          # icon, so a bare import would pass even with QtSvg broken. Asserting
          # on the result is what actually exercises QSvgRenderer against the
          # packaged logo.svg.
          icon = branding.app_icon()
          assert icon is not None and not icon.isNull(), "app_icon() is empty - QtSvg failed silently"
          print("rendered icon sizes:", sorted((s.width(), s.height()) for s in icon.availableSizes()))
          PY

  build:
    name: Build + metadata check
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "build>=1.2" "twine>=6.1"
      - run: python -m build
      # --strict is what catches a README that renders broken on PyPI.
      - run: python -m twine check --strict dist/*

      - name: Assert the package data actually landed in the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          whl = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(whl).namelist())
          required = [
              "copyright_deposit/__init__.py",
              "copyright_deposit/assets/__init__.py",
              "copyright_deposit/assets/logo.svg",
              "copyright_deposit/assets/fonts/README.md",
              "copyright_deposit/core/scanning/__init__.py",
              "copyright_deposit/core/strip/__init__.py",
              "copyright_deposit/gui/panels/__init__.py",
          ]
          missing = [n for n in required if n not in names]
          if missing:
              sys.exit(f"missing from {whl}: {missing}")
          print(f"{whl}: all required files present ({len(names)} entries)")
          PY

      - name: Install the wheel elsewhere and use it
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/wheelenv/bin/python" -m pip install --quiet dist/*.whl
          mkdir -p "$RUNNER_TEMP/elsewhere" && cd "$RUNNER_TEMP/elsewhere"
          "$RUNNER_TEMP/wheelenv/bin/python" - <<'PY'
          from importlib.resources import files
          import copyright_deposit
          import copyright_deposit.core.render  # pulls reportlab through
          from copyright_deposit.core.metrics import _ASSET_DIR

          data = (files("copyright_deposit.assets") / "logo.svg").read_bytes()
          assert data.lstrip().startswith(b"<"), data[:40]
          assert _ASSET_DIR.is_dir(), "assets/fonts/ vanished from the install"
          print("version:", copyright_deposit.__version__, "| logo:", len(data), "bytes")
          PY
          "$RUNNER_TEMP/wheelenv/bin/codendium" --help > /dev/null
          echo "console script ok"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
